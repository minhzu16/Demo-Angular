services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-user_db}
      MYSQL_USER: ${MYSQL_USER:-sa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - tiki_net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - tiki_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Elasticsearch Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - tiki_net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tiki_net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Backend Gateway
  backend:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_ADDITIONAL_LOCATION=/app/config/
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tiki_net
    volumes:
      - ./backend/gateway/config:/app/config:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Auth Service
  auth:
    build:
      context: ./backend
      dockerfile: auth/Dockerfile.simple
    container_name: auth
    # ports: # C-04 FIX: Internal service, route exclusively via Gateway (8080)
    #   - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tiki_net
    restart: unless-stopped

  # Product Service
  product:
    build:
      context: ./backend
      dockerfile: product/Dockerfile
    container_name: product
    # ports: # C-04 FIX: Internal service, route exclusively via Gateway (8080)
    #   - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8081
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
      # Feign targets (defaults point at localhost, which does not exist inside the container)
      - SERVICES_ORDER_URL=http://order:8083
      - SERVICES_REVIEW_URL=http://review:8089
      - SERVICES_SHOP_URL=http://shop:8086
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tiki_net
    restart: unless-stopped

  # Order Service
  order:
    build:
      context: ./backend
      dockerfile: order/Dockerfile
    container_name: order
    # ports: # C-04 FIX: Internal service, route exclusively via Gateway (8080)
    #   - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      # Feign targets (defaults point at localhost, which does not exist inside the container)
      - PRODUCT_SERVICE_URL=http://product:8081
      - PAYMENT_SERVICE_URL=http://payment:8084
      - WAREHOUSE_SERVICE_URL=http://warehouse:8092
      - SETTLEMENT_SERVICE_URL=http://settlement:8094
      - SHOP_SERVICE_URL=http://shop:8086
      - SERVICES_AUTH_URL=http://auth:8082
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tiki_net
    restart: unless-stopped

  # Cart Service
  cart:
    build:
      context: ./backend
      dockerfile: cart/Dockerfile
    container_name: cart
    # ports: # C-04 FIX: Internal service, route exclusively via Gateway (8080)
    #   - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - PRODUCT_SERVICE_URL=http://product:8081
      - SERVICES_AUTH_URL=http://auth:8082
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tiki_net
    restart: unless-stopped

  # Payment Service
  payment:
    build:
      context: ./backend
      dockerfile: payment/Dockerfile
    container_name: payment
    # ports: # C-04 FIX: Internal service, route exclusively via Gateway (8080)
    #   - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ORDER_SERVICE_URL=http://order:8083
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tiki_net
    restart: unless-stopped

  # Warehouse Service
  warehouse:
    build:
      context: ./backend
      dockerfile: warehouse/Dockerfile
    container_name: warehouse
    # ports: # C-04 FIX: Internal service, route exclusively via Gateway (8080)
    #   - "8092:8092"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
      - MYSQL_USER=${MYSQL_USER:-sa}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-123}
      - NOTIFICATION_SERVICE_URL=http://notification:8088
      - SHOP_SERVICE_URL=http://shop:8086
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tiki_net
    restart: unless-stopped

  # Shop Service
  shop:
    build:
      context: ./backend/shop
      dockerfile: Dockerfile.simple
    container_name: shop
    # ports: # C-04 FIX: Internal service, route exclusively via Gateway (8080)
    #   - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECURITY_USERNAME=admin
      - SECURITY_PASSWORD=admin
      - AUTH_HOST=auth
      - AUTH_PORT=8082
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tiki_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Template Storage Service
  template-storage:
    build:
      context: ./backend/template_storage
      dockerfile: Dockerfile.simple
    container_name: template-storage
    # ports: # C-04 FIX: Internal service, route exclusively via Gateway (8080)
    #   - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECURITY_USERNAME=admin
      - SECURITY_PASSWORD=admin
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tiki_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8087/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Notification Service
  notification:
    build:
      context: ./backend/notification
      dockerfile: Dockerfile.simple
    container_name: notification
    # ports: # C-04 FIX: Internal service, route exclusively via Gateway (8080)
    #   - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}  # validates the JWT in STOMP CONNECT frames (must match the gateway)
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - EMAIL_USERNAME=${EMAIL_USERNAME:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - SECURITY_USERNAME=admin
      - SECURITY_PASSWORD=admin
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tiki_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8088/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Review Service
  review:
    build:
      context: ./backend/review
      dockerfile: Dockerfile.simple
    container_name: review
    # ports: # C-04 FIX: Internal service, route exclusively via Gateway (8080)
    #   - "8089:8089"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - ORDER_SERVICE_URL=http://order:8083
      - PRODUCT_SERVICE_URL=http://product:8081
      - NOTIFICATION_SERVICE_URL=http://notification:8088
      - SECURITY_USERNAME=admin
      - SECURITY_PASSWORD=admin
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tiki_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8089/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Analytics Service
  analytics:
    build:
      context: ./backend
      dockerfile: analytics/Dockerfile.simple
    container_name: analytics
    # ports: # C-04 FIX: Internal service, route exclusively via Gateway (8080)
    #   - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ORDER_SERVICE_URL=http://order:8083
      - PRODUCT_SERVICE_URL=http://product:8081
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tiki_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8090/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Chat Service (WebSocket - No DB)
  chat:
    build:
      context: ./backend
      dockerfile: chat/Dockerfile.simple
    container_name: chat
    # ports: # C-04 FIX: Internal service, route exclusively via Gateway (8080)
    #   - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}  # validates the JWT in STOMP CONNECT frames (must match the gateway)
      - SHOP_SERVICE_URL=http://shop:8086  # resolves which shop a seller owns (conversation / inbox access)
    networks:
      - tiki_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8091/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Settlement Service
  settlement:
    build:
      context: ./backend/settlement
      dockerfile: Dockerfile.simple
    container_name: settlement
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SHOP_SERVICE_URL=http://shop:8086
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - ORDER_SERVICE_URL=http://order:8083
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tiki_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8094/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # B2B Wholesale Service
  b2b:
    build:
      context: ./backend/b2b
      dockerfile: Dockerfile.simple
    container_name: b2b
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - ORDER_SERVICE_URL=http://order:8083
      - PRODUCT_SERVICE_URL=http://product:8081
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tiki_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8095/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Live Commerce Service
  live:
    build:
      context: ./backend/live
      dockerfile: Dockerfile.simple
    container_name: live
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${MYSQL_USER:-sa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-123}
      - PRODUCT_SERVICE_URL=http://product:8081
      - ORDER_SERVICE_URL=http://order:8083
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tiki_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8096/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4201:80"
    depends_on:
      - backend
      - product
      - auth
      - order
    networks:
      - tiki_net
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  es_data:
  rabbitmq_data:


networks:
  tiki_net:
    driver: bridge
