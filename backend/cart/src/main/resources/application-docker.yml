# Cấu hình riêng cho môi trường Docker
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/cart_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  # Mở cổng kết nối RabbitMQ (nếu service này sử dụng)
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: /
    connection-timeout: 5000

# Logging cho môi trường Docker
logging:
  level:
    root: INFO
    com.tiki: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    
# External Services trong Docker
services:
  warehouse:
    url: ${WAREHOUSE_SERVICE_URL:http://warehouse:8092}
  shop:
    url: ${SHOP_SERVICE_URL:http://shop:8086}
