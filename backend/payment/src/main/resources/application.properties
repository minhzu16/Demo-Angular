spring.application.name=payment-service
server.port=8084

# Database configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:sa}
spring.datasource.password=${MYSQL_PASSWORD:123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SePay Configuration
sepay.bank-name=${SEPAY_BANK_NAME:VietinBank}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:109874862892}
sepay.api-key=${SEPAY_API_KEY:534fd408-14d8-4c00-8d43-579f4e848959}
sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:F5537B74353F469CB56C7F30E7BCC73C}

# Eureka (Optional)
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

