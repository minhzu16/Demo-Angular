spring.application.name=payment-service
server.port=8084

# Database configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:sa}
spring.datasource.password=${MYSQL_PASSWORD:123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Payment Providers (Optional/Skeletons)
stripe.api.key=${STRIPE_SECRET_KEY:}
momo.partner.code=${MOMO_PARTNER_CODE:MOMO}
momo.access.key=${MOMO_ACCESS_KEY:abc}
momo.secret.key=${MOMO_SECRET_KEY:xyz}

# VNPay Configuration
vnp.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnp.tmnCode=2QX1S61S
vnp.hashSecret=979797ABCDEF1234567890
vnp.apiUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
vnp.returnUrl=http://localhost:4200/payment-success

# Eureka (Optional)
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

