server:
  port: ${SERVICE_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong12345678}

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      x-forwarded:
        enabled: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "${CORS_ALLOWED_ORIGIN:*}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Accept
              - X-Requested-With
            allowCredentials: true
      # ✅ BUG 40 & 41 FIX: Global HTTP client timeout prevents gateway from hanging
      # when a downstream service is unresponsive (fail-fast instead of cascading failure)
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
      routes:
        - id: auth
          uri: http://${AUTH_HOST:auth}:${AUTH_PORT:8082}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/otp/**, /api/v1/membership/**, /api/v1/admin/users/**, /api/v1/admin/audit-logs/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@remoteAddrKeyResolver}"
        - id: product
          uri: http://${PRODUCT_HOST:product}:${PRODUCT_PORT:8081}
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**, /api/v1/brands/**, /api/v1/admin/products/**, /api/v1/wishlists/**, /api/v1/wishlist/**, /api/v1/compare/**, /api/v1/flash-sales/**, /api/products/**
        - id: order
          uri: http://${ORDER_HOST:order}:${ORDER_PORT:8083}
          predicates:
            - Path=/api/v1/orders/**, /api/v1/rma/**, /api/v1/invoices/**, /api/v1/admin/orders/**, /api/admin/orders/**, /api/v1/shipping/**, /api/v1/shipping-methods/**, /api/v1/vouchers/**, /api/v1/tracking/**, /api/vouchers/**, /api/v1/complaints/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@remoteAddrKeyResolver}"
        - id: payment
          uri: http://${PAYMENT_HOST:payment}:${PAYMENT_PORT:8084}
          predicates:
            - Path=/api/v1/payments/**, /api/v1/gift-cards/**, /api/v1/store-credit/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@remoteAddrKeyResolver}"
        - id: cart
          uri: http://${CART_HOST:cart}:${CART_PORT:8085}
          predicates:
            - Path=/api/v1/cart/**
        - id: shop
          uri: http://${SHOP_HOST:shop}:${SHOP_PORT:8086}
          predicates:
            - Path=/api/v1/shops/**, /api/v1/seller-applications/**
        - id: warehouse
          uri: http://${WAREHOUSE_HOST:warehouse}:${WAREHOUSE_PORT:8092}
          predicates:
            - Path=/api/v1/warehouse/**
        - id: template-storage
          uri: http://${TEMPLATE_STORAGE_HOST:template-storage}:${TEMPLATE_STORAGE_PORT:8087}
          predicates:
            - Path=/api/v1/templates/**, /api/v1/marketing/**
        - id: notification
          uri: http://${NOTIFICATION_HOST:notification}:${NOTIFICATION_PORT:8088}
          predicates:
            - Path=/api/v1/notifications/**, /ws-notifications/**
        - id: review
          uri: http://${REVIEW_HOST:review}:${REVIEW_PORT:8089}
          predicates:
            - Path=/api/v1/reviews/**
        - id: analytics
          uri: http://${ANALYTICS_HOST:analytics}:${ANALYTICS_PORT:8090}
          predicates:
            - Path=/api/v1/analytics/**, /api/v1/admin/analytics/**
        - id: chat-ws
          uri: ws://${CHAT_HOST:chat}:${CHAT_PORT:8091}
          predicates:
            - Path=/ws/chat/**
        - id: chat
          uri: http://${CHAT_HOST:chat}:${CHAT_PORT:8091}
          predicates:
            - Path=/api/v1/chat/**
        - id: settlement
          uri: http://${SETTLEMENT_HOST:settlement}:${SETTLEMENT_PORT:8094}
          predicates:
            - Path=/api/v1/settlement/**
        - id: b2b
          uri: http://${B2B_HOST:b2b}:${B2B_PORT:8095}
          predicates:
            - Path=/api/v1/b2b/**
        - id: live
          uri: http://${LIVE_HOST:live}:${LIVE_PORT:8096}
          predicates:
            - Path=/api/v1/live/**

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
