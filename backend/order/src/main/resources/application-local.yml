# Cấu hình cho môi trường local development
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/order_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: localhost
      port: 6379
  # Mở cổng kết nối RabbitMQ local
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
  # Cho phép auto reload trong development
  devtools:
    restart:
      enabled: true
  flyway:
    baseline-on-migrate: true

# Logging chi tiết hơn cho development
logging:
  level:
    root: INFO
    com.tiki.templatestorage: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# External services trong local
services:
  warehouse:
    url: http://localhost:8092
  shop:
    url: http://localhost:8086
    
# Đặt biến môi trường cho swagger-ui
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    enabled: true
