<div class="d-flex align-items-center">
  <!-- Search -->
  <div class="search-box me-3 d-none d-md-block">
    <div class="input-group">
      <span class="input-group-text bg-light border-0">
        <i class="anticon anticon-search text-muted"></i>
      </span>
      <input type="text" class="form-control border-0 bg-light" placeholder="Search...">
    </div>
  </div>
  
  <!-- Language Switcher -->
  <div class="dropdown me-3">
    <button class="btn btn-link text-dark text-decoration-none" 
            type="button" 
            data-bs-toggle="dropdown">
      <span class="fw-semibold">{{ translate.currentLang === 'vi' ? 'VI' : 'EN' }}</span>
      <i class="bi bi-chevron-down ms-1" style="font-size: 10px;"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end" style="min-width: 100px;">
      <li><a class="dropdown-item" (click)="changeLang('vi')" href="javascript:void(0)">Tiếng Việt (VI)</a></li>
      <li><a class="dropdown-item" (click)="changeLang('en')" href="javascript:void(0)">English (EN)</a></li>
    </ul>
  </div>
  
  <!-- Notifications -->
  <div class="dropdown me-3">
    <button class="btn btn-link text-dark position-relative" 
            type="button" 
            data-bs-toggle="dropdown">
      <i class="anticon anticon-bell" style="font-size: 1.25rem;"></i>
      <span *ngIf="unreadCount > 0" 
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        {{ unreadCount }}
      </span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end" style="width: 300px;">
      <li class="dropdown-header d-flex justify-content-between align-items-center">
        <span>Thông báo</span>
        <button class="btn btn-link btn-sm p-0 text-decoration-none" (click)="markAllAsRead()">Đánh dấu đã đọc</button>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li *ngFor="let notification of notifications">
        <a class="dropdown-item" 
           [class.fw-bold]="!notification.read"
           href="javascript:void(0)"
           (click)="notificationService.markAsRead(notification.id).subscribe()">
          <div class="d-flex justify-content-between">
            <span style="font-size: 13px;">{{ notification.message }}</span>
            <small class="text-muted" style="font-size: 10px;">{{ getTimeAgo(notification.createdAt) }}</small>
          </div>
        </a>
      </li>
      <li *ngIf="notifications.length === 0" class="p-3 text-center text-muted">
        Không có thông báo mới
      </li>
      <li><hr class="dropdown-divider"></li>
      <li><a class="dropdown-item text-center small text-primary" routerLink="/notifications">Xem tất cả thông báo</a></li>
    </ul>
  </div>
  
  <!-- User Menu -->
  <div class="dropdown">
    <button class="btn btn-link text-dark d-flex align-items-center text-decoration-none" 
            type="button" 
            data-bs-toggle="dropdown">
      <div class="avatar me-2">
        <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center text-white" 
             style="width: 32px; height: 32px; font-weight: 700;">
          {{ user?.fullName?.charAt(0) || user?.username?.charAt(0) || 'U' | uppercase }}
        </div>
      </div>
      <span class="d-none d-md-inline fw-semibold" style="font-size: 14px;">{{ user?.fullName || user?.username || 'Người dùng' }}</span>
      <i class="bi bi-chevron-down ms-2" style="font-size: 10px;"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
      <li><a class="dropdown-item py-2" routerLink="/profile"><i class="bi bi-person-circle me-2 text-primary"></i>Hồ sơ cá nhân</a></li>
      <li><a class="dropdown-item py-2" routerLink="/orders"><i class="bi bi-bag-check me-2 text-success"></i>Đơn hàng của tôi</a></li>
      <li><a class="dropdown-item py-2" routerLink="/settings"><i class="bi bi-gear me-2 text-secondary"></i>Cài đặt</a></li>
      <li><hr class="dropdown-divider"></li>
      <li><a class="dropdown-item py-2 text-danger" (click)="logout()" style="cursor: pointer;"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
    </ul>
  </div>
</div>
