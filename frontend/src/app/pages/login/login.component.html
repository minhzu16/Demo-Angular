<div class="auth-wrapper page-fade-in">
  <!-- Right panel – branding (Moved left to right or reversed for design, keeping left as branding) -->
  <div class="auth-brand">
    <div class="auth-brand-bg-orb"></div>
    <div class="auth-brand-bg-orb-2"></div>
    <div class="brand-inner stagger-children">
      <div class="brand-logo">
        <i class="bi bi-lightning-charge-fill"></i>
      </div>
      <h1 class="brand-title"><span class="logo-nex">Nex</span><span class="logo-mart">Mart</span></h1>
      <p class="brand-tagline">Mua sắm thông minh<br>Trải nghiệm đỉnh cao ⚡</p>
      <div class="brand-features text-start">
        <div class="bf-item"><i class="bi bi-truck"></i> <span>Giao hàng siêu tốc 2H</span></div>
        <div class="bf-item"><i class="bi bi-shield-check"></i> <span>100% chính hãng</span></div>
        <div class="bf-item"><i class="bi bi-lightning-charge-fill"></i> <span>Tích NexPoints mọi đơn</span></div>
      </div>
    </div>
  </div>

  <!-- Left panel – form -->
  <div class="auth-form-panel">
    <a routerLink="/home" class="back-home-btn"><i class="bi bi-arrow-left"></i> Trang chủ</a>
    
    <div class="auth-card animate-float-up">
      <div class="text-center mb-5">
        <h2 class="auth-title">Chào mừng trở lại! 👋</h2>
        <p class="auth-subtitle">Đăng nhập vào tài khoản của bạn</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="nx-form-group">
          <label for="username" class="nx-form-label">Tên đăng nhập</label>
          <div class="nx-input-icon">
            <i class="bi bi-person"></i>
            <input
              type="text"
              class="nx-form-control"
              id="username"
              formControlName="username"
              placeholder="Nhập tên đăng nhập"
              [class.is-invalid]="form.get('username')?.invalid && form.get('username')?.touched">
          </div>
          <div class="nx-error-text" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
            Vui lòng nhập tên đăng nhập
          </div>
        </div>

        <div class="nx-form-group">
          <label for="password" class="nx-form-label">Mật khẩu</label>
          <div class="nx-input-icon">
            <i class="bi bi-lock"></i>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="nx-form-control"
              id="password"
              formControlName="password"
              placeholder="Nhập mật khẩu"
              [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched">
            <button type="button" class="nx-btn-icon" (click)="togglePassword()">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
          <div class="nx-error-text" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
            Vui lòng nhập mật khẩu
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
          <div class="nx-checkbox">
            <input type="checkbox" id="rememberMe" formControlName="rememberMe">
            <label for="rememberMe">Ghi nhớ đăng nhập</label>
          </div>
          <a href="javascript:void(0)" class="nx-link-sm">Quên mật khẩu?</a>
        </div>

        <div class="alert alert-danger" *ngIf="error">
          <i class="bi bi-exclamation-triangle"></i><span>{{ error }}</span>
        </div>

        <button type="submit" class="btn btn-primary btn-xl w-100 btn-submit"
                [disabled]="form.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? 'Đang xác thực...' : 'Đăng nhập ngay' }}
        </button>
      </form>

      <div class="auth-divider">
        <span>hoặc</span>
      </div>

      <div class="auth-social">
        <button class="btn-social google"><i class="bi bi-google"></i></button>
        <button class="btn-social facebook"><i class="bi bi-facebook"></i></button>
      </div>

      <div class="text-center mt-4">
        <span class="text-muted small">Chưa có tài khoản? </span>
        <a routerLink="/register" class="nx-link fw-semibold">Đăng ký ngay</a>
      </div>
    </div>
  </div>
</div>
