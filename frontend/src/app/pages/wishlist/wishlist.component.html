<div class="wishlist-page page-fade-in">
  <div class="page-header">
    <div class="container">
      <h1 class="page-title"><i class="bi bi-heart-fill me-2 text-danger"></i>Danh sách yêu thích</h1>
      <p class="page-subtitle">{{ products.length }} sản phẩm</p>
    </div>
  </div>

  <div class="container py-4">
    <!-- Skeleton -->
    <div *ngIf="loading" class="products-grid">
      <div *ngFor="let i of [1,2,3,4,5,6,7,8]" class="product-card skeleton-card">
        <div class="skeleton" style="height:200px;border-radius:12px 12px 0 0"></div>
        <div class="p-3">
          <div class="skeleton mb-2" style="height:16px;width:80%"></div>
          <div class="skeleton" style="height:14px;width:50%"></div>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading && products.length === 0" class="empty-state">
      <i class="bi bi-heart display-3 text-muted"></i>
      <h3 class="mt-3">Danh sách trống</h3>
      <p class="text-muted">Bạn chưa thêm sản phẩm nào vào danh sách yêu thích</p>
      <a routerLink="/products" class="btn btn-primary mt-2">
        <i class="bi bi-grid me-2"></i>Khám phá sản phẩm
      </a>
    </div>

    <!-- Product grid -->
    <div *ngIf="!loading && products.length > 0" class="products-grid">
      <div *ngFor="let product of products" class="product-card">
        <div class="product-image" [routerLink]="['/products', product.id]">
          <img [src]="product.imageUrl || 'assets/placeholder-product.jpg'"
               [alt]="product.name" loading="lazy">
          <div class="product-badge" *ngIf="product.discount">-{{ product.discount }}%</div>
        </div>
        <div class="product-info">
          <h3 class="product-name" [routerLink]="['/products', product.id]">{{ product.name }}</h3>
          <div class="product-price">{{ formatPrice(product.price) }}</div>
          <button class="btn-add-cart"
                  (click)="addToCart(product)"
                  [disabled]="addingToCart === product.id">
            <span *ngIf="addingToCart === product.id" class="spinner-border spinner-border-sm me-1"></span>
            <i *ngIf="addingToCart !== product.id" class="bi bi-cart-plus me-1"></i>
            {{ addingToCart === product.id ? 'Đang thêm...' : 'Thêm vào giỏ' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
