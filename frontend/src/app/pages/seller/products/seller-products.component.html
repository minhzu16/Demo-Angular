<div class="seller-products-page">
    <div class="page-header d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 text-gray-800">Quản lý sản phẩm</h1>
        <button class="btn btn-primary" routerLink="/seller/products/new">
            <i class="bi bi-plus-lg me-2"></i>Thêm sản phẩm mới
        </button>
    </div>

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Danh sách sản phẩm</h6>
        </div>
        <div class="card-body">
            <div *ngIf="loading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Đang tải...</span>
                </div>
            </div>

            <div *ngIf="!loading && products.length === 0" class="text-center py-5">
                <div class="empty-state">
                    <i class="bi bi-box-seam display-4 text-gray-300 mb-3 d-block"></i>
                    <p class="text-muted mb-3">Shop chưa có sản phẩm nào</p>
                    <button class="btn btn-primary" routerLink="/seller/products/new">Tạo sản phẩm đầu tiên</button>
                </div>
            </div>

            <div class="table-responsive" *ngIf="!loading && products.length > 0">
                <table class="table table-bordered table-hover" width="100%" cellspacing="0">
                    <thead>
                        <tr>
                            <th style="width: 50px">ID</th>
                            <th style="width: 80px">Ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Giá</th>
                            <th>Kho</th>
                            <th>Đã bán</th>
                            <th style="width: 120px">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let product of products">
                            <td>{{ product.id }}</td>
                            <td>
                                <div class="product-img-wrapper">
                                    <img [src]="product.thumbnailUrl || product.imageUrl || 'assets/placeholder-product.jpg'"
                                        [alt]="product.name">
                                </div>
                            </td>
                            <td>
                                <div class="fw-bold text-truncate" style="max-width: 200px;">{{ product.name }}</div>
                                <small class="text-muted">{{ product.categoryName || 'Chưa phân loại' }}</small>
                            </td>
                            <td>{{ formatPrice(product.price) }}</td>
                            <td>
                                <span [class.text-danger]="(product.stock || 0) < 10">{{ product.stock || 0 }}</span>
                            </td>
                            <td>{{ product.soldCount || 0 }}</td>
                            <td>
                                <div class="btn-group">
                                    <button class="btn btn-sm btn-outline-primary"
                                        [routerLink]="['/seller/products/edit', product.id]" title="Chỉnh sửa">
                                        <i class="bi bi-pencil-square"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" (click)="deleteProduct(product.id)"
                                        title="Xóa">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
